<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Panduan belajar jaringan komputer lengkap untuk cybersecurity: OSI, TCP/IP, subnetting, routing, protokol, Wi-Fi, serangan, dan laboratorium praktis." />
  <meta name="theme-color" content="#070d1c" />
  <title>Belajar Jaringan — Panduan Jaringan Komputer untuk Cybersecurity</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b1226'/%3E%3Cpath d='M32 10 12 22v20l20 12 20-12V22L32 10Zm0 8 12 7v14l-12 7-12-7V25l12-7Z' fill='%2334d399'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%2322d3ee'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false"><defs>
    <marker id="global-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#22d3ee"/></marker>
    <marker id="global-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#34d399"/></marker>
    <marker id="global-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fb7185"/></marker>
  </defs></svg>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi materi">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none"><path d="M20 3 4 12v16l16 9 16-9V12L20 3Z" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="5" stroke="currentColor" stroke-width="2"/><path d="M20 8v7M20 25v7M8.5 13.5l6 3.5M25.5 23l6 3.5M31.5 13.5l-6 3.5M14.5 23l-6 3.5" stroke="currentColor" stroke-width="2"/></svg>
        </div>
        <div class="brand-text">
          <strong>Belajar <span>Jaringan</span></strong>
          <small>Jaringan → Cybersecurity</small>
        </div>
      </div>

      <div class="sidebar-progress" id="sidebarProgress">
        <div class="progress-head"><span>Progres belajar</span><strong id="progressPercent">0%</strong></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <small id="progressLabel">0 dari 14 materi selesai</small>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="sidebar-footer">
        <div class="sidebar-actions">
          <button class="ghost-btn good" id="exportProgress" type="button" title="Unduh progres belajar ke file JSON">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
            Ekspor
          </button>
          <button class="ghost-btn info" id="importProgress" type="button" title="Muat progres belajar dari file JSON">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
            Impor
          </button>
        </div>
        <input id="importFile" type="file" accept="application/json,.json" hidden />
        <button class="ghost-btn" id="resetProgress" type="button" title="Hapus progres belajar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
          Reset progres
        </button>
      </div>
    </aside>

    <div class="content-shell">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Buka menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="breadcrumb" id="breadcrumb">Beranda</div>
        <div class="top-actions">
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input id="searchInput" type="search" placeholder="Cari materi, protokol, perintah…" autocomplete="off" aria-label="Cari materi" />
            <kbd>/</kbd>
            <div class="search-results" id="searchResults" hidden></div>
          </div>
          <button class="icon-btn" id="themeBtn" type="button" aria-label="Ganti tema" title="Ganti tema terang/gelap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
          </button>
          <a class="icon-btn" href="https://www.rfc-editor.org/" target="_blank" rel="noopener noreferrer" aria-label="Sumber RFC" title="Sumber RFC">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
          </a>
        </div>
      </header>

      <div class="reading-layout">
        <main class="course" id="course" tabindex="-1"></main>
        <aside class="toc" id="toc" aria-label="Daftar isi materi">
          <div class="toc-inner" id="tocInner"></div>
        </aside>
      </div>

      <footer class="site-footer">
        <span>Belajar Jaringan — materi belajar mandiri, gunakan pengetahuan secara etis &amp; legal.</span>
        <span>Dibuat untuk pemula yang serius masuk ke dunia cybersecurity.</span>
      </footer>
    </div>
  </div>

  <div class="mobile-scrim" id="mobileScrim" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/diagrams.js"></script>
  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
